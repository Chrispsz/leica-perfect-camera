name: Build Leica Perfect APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Cancel previous runs when pushing new commits
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: "2G"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-34 build-tools;34.0.0'

      - name: Install ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache sed grep git
          ccache --version
          mkdir -p $CCACHE_DIR

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make build script executable
        run: chmod +x build-archlinux.sh

      - name: Clone upstream
        run: ./build-archlinux.sh clone

      - name: Apply patches
        run: ./build-archlinux.sh patch

      - name: Show ccache stats before build
        run: ccache --show-stats || true

      - name: Build APK (with ccache)
        run: |
          export ANDROID_HOME=${ANDROID_HOME}
          export PATH="/usr/lib/ccache:$PATH"
          export USE_CCACHE=1
          export NDK_CCACHE=ccache
          # Configure native build to use ccache
          export GRADLE_USER_HOME="$HOME/.gradle"
          ./build-archlinux.sh build

      - name: Show ccache stats after build
        if: always()
        run: ccache --show-stats || true

      - name: Find APK
        run: |
          echo "=== Procurando APK ==="
          find /tmp/photon_upstream -name "*.apk" -type f 2>/dev/null
          find /tmp/leica_build -name "*.apk" -type f 2>/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: leica-perfect-apk
          path: |
            /tmp/photon_upstream/app/build/outputs/apk/**/*.apk
            /tmp/leica_build/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/photon_upstream/app/build/outputs/
            /tmp/photon_upstream/*.log
          if-no-files-found: ignore
          retention-days: 7
